name: sbom-lens
services:
  apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.2.1
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: ${DT_DB_PASSWORD:?Set DT_DB_PASSWORD in .env}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["api-data:/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: ghcr.io/dependencytrack/frontend:5.2.1
    environment:
      API_BASE_URL: http://localhost:8080
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DT_DB_PASSWORD:?Set DT_DB_PASSWORD in .env}
    volumes: ["db-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  api-data: {}
  db-data: {}
